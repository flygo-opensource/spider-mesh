name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spider-mesh/events
    steps:
      - name: Checkout events
        uses: actions/checkout@v4
        with:
          path: spider-mesh/events

      # 1.2.x cài dependency `file:` thành symlink tự trỏ vào chính nó, nên clone mới không build
      # được; 1.4.2 tạo symlink tuyệt đối về source.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:e2e
